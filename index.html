<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#003366">
    <meta name="description" content="Interactive California DMV Driver's Knowledge Question Bank and Study System with Visual Diagrams.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
    <title>California DMV Questions & Study Guide (120 Questions)</title>
</head>
<body>
    <!-- App Header Bar -->
    <header class="app-navbar">
        <div class="nav-container">
            <div class="nav-brand" id="brand-home" role="button" tabindex="0" title="CA DMV Questions Hub">
                <span class="nav-logo">🐻</span>
                <div class="brand-text">
                    <span class="brand-title">CA DMV Questions</span>
                    <span class="brand-tagline">120 Interactive Questions</span>
                </div>
            </div>

            <!-- Header Stats & Quick Actions -->
            <div class="nav-stats-bar">
                <div class="stat-pill" id="score-counter" title="Total Correct / Answered">
                    <span class="stat-icon">🎯</span>
                    <span id="score-text">0 / 0 (0%)</span>
                </div>
                <button class="nav-action-btn" id="btn-toggle-grid" title="Open Question Map (1-120)">
                    <span>📋 Question Map</span>
                </button>
                <button class="nav-action-btn" id="btn-toggle-view" title="Toggle Single Question vs All Questions List">
                    <span id="view-toggle-text">📖 List View</span>
                </button>
            </div>

            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle theme">🌙</button>
            </div>
        </div>
    </header>

    <!-- Main Question Application Area -->
    <main class="app-content">
        <!-- Topic Filter Bar -->
        <section class="topic-filter-bar" aria-label="Filter by category">
            <div class="category-scroll-container" id="category-pills">
                <button class="cat-pill active" data-cat="all">🌟 All Questions (120)</button>
                <button class="cat-pill" data-cat="Traffic Signs">🚦 Traffic Signs (20)</button>
                <button class="cat-pill" data-cat="Rules of the Road">🛣️ Rules of Road (20)</button>
                <button class="cat-pill" data-cat="Safe Driving">🚗 Safe Driving (20)</button>
                <button class="cat-pill" data-cat="Parking">🅿️ Parking (20)</button>
                <button class="cat-pill" data-cat="Right of Way">🚶 Right of Way (20)</button>
                <button class="cat-pill" data-cat="Emergencies">⚠️ Emergencies (20)</button>
                <button class="cat-pill cat-pill-bookmark" data-cat="bookmarked">⭐ Flagged (<span id="bookmark-count">0</span>)</button>
                <button class="cat-pill cat-pill-missed" data-cat="missed">❌ Missed (<span id="missed-count">0</span>)</button>
            </div>
        </section>

        <!-- SINGLE QUESTION VIEW (Default) -->
        <section id="single-question-view" class="view-panel active">
            <!-- Question Card Top Bar -->
            <div class="q-header-meta">
                <div class="q-meta-left">
                    <span id="q-number-badge" class="badge badge-qnum">Question 1 of 120</span>
                    <span id="q-category-badge" class="badge badge-category">Traffic Signs</span>
                </div>
                <div class="q-meta-right">
                    <button id="btn-bookmark" class="btn-icon-text" title="Bookmark/Flag question for review">
                        <span id="bookmark-icon">⭐</span>
                        <span id="bookmark-label">Bookmark</span>
                    </button>
                    <button id="btn-reset-current" class="btn-icon-text" title="Reset this question">
                        <span>🔄 Reset</span>
                    </button>
                </div>
            </div>

            <!-- Main Question Card -->
            <div class="card question-card">
                <!-- Visual Illustration Box -->
                <div id="q-illustration" class="q-illustration-box"></div>

                <!-- Question Text -->
                <h2 id="q-text" class="question-title">Loading question...</h2>

                <!-- Answer Options Container -->
                <div id="q-options" class="options-grid"></div>

                <!-- Feedback & Explanation Box -->
                <div id="q-feedback" class="feedback-panel" style="display: none;">
                    <div class="feedback-status-bar">
                        <span id="feedback-badge" class="badge feedback-badge-pill"></span>
                        <span class="keyboard-tip-inline">Press <kbd>→</kbd> or <kbd>Enter ↵</kbd> for Next</span>
                    </div>
                    <p id="feedback-explanation" class="feedback-body"></p>
                </div>
            </div>

            <!-- Question Navigation Footer Controls -->
            <div class="q-navigation-bar">
                <button id="btn-prev-q" class="btn-nav btn-prev" title="Previous Question (Left Arrow)">
                    <span>← Previous</span>
                </button>

                <div class="q-nav-center">
                    <button id="btn-random-q" class="btn-nav btn-random" title="Jump to a Random Question">
                        <span>🔀 Random</span>
                    </button>
                    <button id="btn-clear-progress" class="btn-nav btn-clear" title="Reset all answer history">
                        <span>🗑️ Reset All</span>
                    </button>
                </div>

                <button id="btn-next-q" class="btn-nav btn-next" title="Next Question (Right Arrow / Space / Enter)">
                    <span>Next Question →</span>
                </button>
            </div>
        </section>

        <!-- FULL LIST / STUDY LIST VIEW (Toggleable) -->
        <section id="full-list-view" class="view-panel" style="display: none;">
            <div class="list-view-header">
                <div class="search-box-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="list-search-input" placeholder="Search questions, road rules, speed limits, parking..." autocomplete="off">
                </div>
                <button id="btn-print-list" class="btn-secondary" title="Print all questions & answers">🖨️ Print Sheet</button>
            </div>

            <div id="list-count-display" class="list-stats-info">Showing 120 questions</div>
            <div id="full-questions-container" class="full-questions-list"></div>
        </section>

        <!-- QUESTION BUBBLE MAP MODAL (Drawer / Popover) -->
        <div id="question-map-modal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>📋 Question Map (1 to 120)</h3>
                    <button id="btn-close-map" class="btn-close-modal" aria-label="Close modal">✕</button>
                </div>
                <div class="modal-legend">
                    <span class="legend-item"><span class="dot dot-correct"></span> Correct</span>
                    <span class="legend-item"><span class="dot dot-incorrect"></span> Incorrect</span>
                    <span class="legend-item"><span class="dot dot-flagged"></span> Bookmarked</span>
                    <span class="legend-item"><span class="dot dot-unanswered"></span> Unanswered</span>
                </div>
                <div id="question-map-grid" class="question-bubbles-grid"></div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/questions.js"></script>
    <script src="js/illustrations.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
